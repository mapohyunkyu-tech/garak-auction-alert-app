name: Build Garak Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract source
        run: unzip -q garak_github_android_source.zip -d .
      - name: Build APK
        run: gradle --project-dir android :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: garak-auction-alert-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
